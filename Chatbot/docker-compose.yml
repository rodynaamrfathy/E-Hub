version: '3.8'

services:
  # Chatbot Backend Service
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot-backend
    ports:
      - "8000:8000"
    environment:
      # Database
      - DATABASE_URL=postgresql://chatbot_user:chatbot_pass@postgres:5432/chatbot_db
      - DATABASE_URL_mcp_test=postgresql://chatbot_user:chatbot_pass@postgres:5432/chatbot_db
      
      # API Keys (You should set these in .env file)
      - API_KEY=${API_KEY:-}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      
      # LangSmith Configuration
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-Dawar}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      
      # Chatbot Configuration
      - CHATBOT_MODEL=${CHATBOT_MODEL:-gemini-2.5-pro}
      - MAX_HISTORY=${MAX_HISTORY:-50}
      
      # Redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./config.py:/app/config.py
    networks:
      - chatbot-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: chatbot-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@chatbot.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - chatbot-network
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  chatbot-network:
    driver: bridge
