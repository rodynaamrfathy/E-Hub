version: '3.8'

services:
  # Chatbot Backend Service (Development)
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chatbot-backend-dev
    ports:
      - "8000:8000"    # FastAPI development server
      - "8888:8888"    # Jupyter notebook (optional)
      - "5678:5678"    # Python debugger
    environment:
      # Environment
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      
      # Database (Neon)
      - DATABASE_URL=${NEON_DATABASE_URL}
      - DATABASE_URL_mcp_test=${NEON_DATABASE_URL}
      - NEON_DATABASE_URL=${NEON_DATABASE_URL}
      
      # API Keys
      - API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEY_MM=${GOOGLE_API_KEY_MM:-${GOOGLE_API_KEY}}
      - EXA_API_KEY=${EXA_API_KEY:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      
      # LangSmith Configuration
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-Dawar}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}

      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_mcp_test=${DATABASE_URL_mcp_test}
      - NEON_DATABASE_URL=${NEON_DATABASE_URL}
      
      # Chatbot Configuration
      - CHATBOT_MODEL=${CHATBOT_MODEL:-gemini-2.5-pro}
      - MAX_HISTORY=${MAX_HISTORY:-50}
      
      # Database Performance Settings
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      
      # Development Configuration
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - ALLOWED_HOSTS=*
      - ENABLE_DOCS=true
      - ENABLE_METRICS=true
      - ENABLE_HEALTH_CHECKS=true
    volumes:
      # Mount source code for hot reload
      - ./backend:/app/backend:rw
      - ./requirements.txt:/app/requirements.txt:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Mount cache directories for better performance
      - dev-cache:/home/dev/.cache
      - dev-local:/home/dev/.local
    networks:
      - chatbot-network
    restart: unless-stopped
    # Enable development features
    stdin_open: true
    tty: true
    # Add development labels
    labels:
      - "dev.environment=development"
      - "dev.service=chatbot-backend"

# Named volumes for development
volumes:
  dev-cache:
    driver: local
  dev-local:
    driver: local

networks:
  chatbot-network:
    driver: bridge
