  # Dawar Features
  - id: feature_001
    content_type: feature
    title: "Report Street Waste"
    content: |
      Report Street Waste feature allows users to snap a photo of litter, after which Dawar notifies the responsible collector and shares an "after" photo when the waste is cleaned. This feature enables community-driven waste reporting and creates accountability in the cleaning process.
    metadata:
      parent_solution: "Dawar"
      feature_type: "waste_reporting"
      user_action: "photo_capture"
      workflow: ["photo_capture", "notification", "cleanup", "confirmation"]
      community_engagement: true
