  # Solutions
  - id: solution_001
    content_type: solution
    title: "Dawar - Community & Circular Economy Platform"
    content: |
      Dawar is Environ Adapt's mobile app for circular solutions that empowers residents, informal waste pickers, recyclers, and brand owners to participate in the circular economy. The platform serves as a comprehensive digital solution connecting various stakeholders in the waste management ecosystem. Target users include households, informal waste pickers, collection centers, haulers, recycling facilities, brand owners, and the general public. The Dawar Community includes anyone contributing to the circular economy - from people who sort waste at home to waste pickers and designers repurposing trash into art, all connected through sustainable action.
    metadata:
      solution_name: "Dawar"
      solution_type: "Community & Circular Economy Platform"
      platform_type: "mobile_app"
      target_users: 
        - "Households"
        - "Informal Waste Pickers"
        - "Collection Centers"
        - "Haulers"
        - "Recycling Facilities"
        - "Brand Owners"
        - "General Public"
      features_count: 4
      geographic_focus: "Egypt"
      community_focus: "circular_economy_participants"
