  # Brand Services
  - id: service_001
    content_type: brand_service
    title: "Waste Traceability"
    content: |
      Waste Traceability service provides digital tracking of post-consumer waste including PET, HDPE, and UBC from collection to recycling. This service ensures compliance with Extended Producer Responsibility (EPR) mandates and offers complete transparency in the waste management process. Current clients include major global brands implementing sustainability programs.
