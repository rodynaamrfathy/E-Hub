    title: "Request Sorted Waste Pickup"
    content: |
      Request Sorted Waste Pickup feature allows users to schedule pickup of recyclable materials from homes or businesses. This service facilitates proper waste sorting and collection, supporting the circular economy by ensuring recyclable materials reach appropriate processing facilities.
