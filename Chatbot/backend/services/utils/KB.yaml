  # Company History
  - id: history_001
    content_type: history
    title: "Company History and Origins"
    content: |
      Environ Adapt was founded in 2018. Dawar started as a beta test for a photo-sharing feature when a "before and after" post about cleaning street waste went viral on Facebook, resulting in 20,000 downloads in two weeks and ranking #1 in the Productivity category in Egypt. The core concept involves residents snapping photos of street waste, the app sending reports to local collectors, collectors cleaning and uploading "after" photos, and users receiving confirmation. The company gained recognition when it was featured in a leading Japanese newspaper for innovative urban waste engagement.
    metadata:
      launch_year: 2018
      origin_story: "viral_facebook_post"
      initial_downloads: 20000
      timeframe: "two_weeks"
      ranking_achievement: "#1_productivity_egypt"
      concept_workflow: ["photo_capture", "report_generation", "collector_notification", "cleanup", "confirmation"]
      international_recognition: "Japanese_newspaper_feature"
      innovation_focus: "urban_waste_engagement"
