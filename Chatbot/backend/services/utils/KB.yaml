      waste_types: ["PET", "HDPE", "UBC"]
      process_coverage: ["collection", "sorting", "recycling"]
      compliance: ["EPR", "Law 202/2020"]
      tracking_method: "digital"
      clients:
        - "The Coca-Cola Company (World Without Waste program)"
        - "PepsiCo"
        - "Unilever"
        - "Tetra Pak (UBC pilot)"
        - "Nestlé Waters"
