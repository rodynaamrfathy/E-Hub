    title: "Dawar Marketplace"
    content: |
      Dawar Marketplace enables users to buy and sell high-quality recyclable materials including PET flakes, PET pellets, and cardboard. Currently available in Egypt, the marketplace connects waste generators with recyclers to create a functional circular economy. Users can contact Environ Adapt to buy or sell other waste materials beyond the standard offerings.
