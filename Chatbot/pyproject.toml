[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-backend"
version = "1.0.0"
description = "AI-powered chatbot for waste management and sustainability guidance"
authors = [
    {name = "Development Team", email = "dev@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi==0.104.1",
    "mangum==0.17.0",
    "pydantic==2.5.0",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "pgvector==0.2.4",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "langchain>=0.2.0,<0.3.0",
    "langchain-core<0.3.0",
    "langchain-google-genai<2.1.0",
    "langchain-exa>=0.1.0",
    "google-generativeai>=0.7.0,<0.9.0",
    "langsmith>=0.1.0",
    "rapidfuzz==3.5.2",
    "numpy==1.24.4",
    "scikit-learn>=1.3.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "ipython==8.17.2",
    "jupyter==1.0.0",
    "watchdog[watchmedo]==3.0.0",
    "debugpy==1.8.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
