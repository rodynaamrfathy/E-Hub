[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-backend"
version = "1.0.0"
description = "AI-powered chatbot for waste management and sustainability guidance"
authors = [
    {name = "Development Team", email = "dev@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "aiohttp==3.12.14",
    "fastapi==0.117.1",
    "mangum==0.19.0",
    "pydantic==2.11.9",
    "uvicorn==0.36.0",
    "sqlalchemy==2.0.43",
    "asyncpg==0.29.0",
    "pgvector==0.4.1",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.2",
    "langchain==0.3.27",
    "langchain-exa==0.3.1",
    "langchain-google-genai==2.1.12",
    "langsmith==0.4.29",
    "rapidfuzz==3.14.1",
    "numpy==2.3.3",
    "scikit-learn==1.7.2",
    "pillow==11.3.0",
    "protobuf==6.32.1",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "black==23.11.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
    "ipython==8.17.2",
    "jupyter==1.0.0",
    "watchdog[watchmedo]==3.0.0",
    "debugpy==1.8.0",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
